name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - platform: macos-14
            rust-target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (RULE-001 / CFG-002, AT-090)
        run: pnpm lint

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.rust-target }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdviedit-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/*
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg/*
